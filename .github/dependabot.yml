version: 2
updates:
  # Python — FastAPI layer runtime + legacy pins (root requirements.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Python — backend/ (requirements.txt + requirements-dev.txt).
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # React SPA.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Keep the CI/SCA workflow actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
