<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Cibara Comforts</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        background: linear-gradient(160deg, #0ea5e9 0%, #0f172a 70%);
        color: #f8fafc;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
      }
      .badge {
        width: 72px; height: 72px;
        border-radius: 18px;
        margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 700;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.18);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #cbd5e1; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 600;
        color: #0f172a; background: #f8fafc;
        border: 0; border-radius: 10px;
        padding: 11px 20px; cursor: pointer;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">C</div>
      <h1>You're offline</h1>
      <p>
        Cibara Comforts needs an internet connection for live booking, billing
        and settlement data. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
