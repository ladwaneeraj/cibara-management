<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Cibara Comforts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/login.css" />
  </head>
  <body>
    <div class="login-shell">
      <!-- Subtle animated gradient background -->
      <div class="login-bg" aria-hidden="true">
        <div class="login-bg-blob login-bg-blob--a"></div>
        <div class="login-bg-blob login-bg-blob--b"></div>
        <div class="login-bg-blob login-bg-blob--c"></div>
      </div>

      <main class="login-card" role="main">
        <header class="login-header">
          <div class="login-logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32">
              <path
                d="M4 14L16 4l12 10v14a2 2 0 0 1-2 2h-6v-9h-8v9H6a2 2 0 0 1-2-2V14z"
                fill="currentColor"
              />
            </svg>
          </div>
          <h1 class="login-title">Cibara Comforts</h1>
          <p class="login-subtitle">Sign in to continue</p>
        </header>

        <form id="login-form" class="login-form" autocomplete="on" novalidate>
          <div class="field">
            <label for="user-id" class="field-label">User ID</label>
            <input
              id="user-id"
              name="userId"
              type="text"
              inputmode="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              minlength="2"
              maxlength="31"
              placeholder="e.g. neeraj"
              class="field-input"
              aria-describedby="login-error"
            />
          </div>

          <div class="field">
            <label for="password" class="field-label">Password</label>
            <div class="field-input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                minlength="6"
                placeholder="Your password"
                class="field-input"
                aria-describedby="login-error"
              />
              <button
                type="button"
                id="toggle-password"
                class="field-input-toggle"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div
            id="login-error"
            class="login-error"
            role="alert"
            aria-live="polite"
            hidden
          ></div>

          <button id="login-submit" type="submit" class="btn-submit">
            <span class="btn-label">Sign in</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <footer class="login-footer">
          <p>Lodge Management System</p>
        </footer>
      </main>
    </div>

    <!-- Firebase web SDK (compat build — same pattern as the main app) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <!-- Server-rendered Firebase config -->
    <script src="/firebase-config.js"></script>
    <script src="/static/login.js"></script>
  </body>
</html>
