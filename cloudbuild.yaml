steps:
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "lodge-management"
      - "--source=."
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      # Keep one instance warm so checkout/checkin never pay a cold-start
      # penalty (the old 5-7s spikes). Steady-state checkout is ~0.5s.
      - "--min-instances=1"
      # Startup CPU boost shortens any cold start that does occur.
      - "--cpu-boost"
      - "--clear-base-image"
      # ── Environment is managed in the Cloud Run CONSOLE, not here ─────────
      # This deploy intentionally does NOT set any env vars or secrets.
      # Cloud Run merges revisions: anything you've bound in the console
      # (Edit & Deploy New Revision → Variables & Secrets) is PRESERVED on
      # every triggered build. So bind all secrets once in the console and
      # every future commit-triggered revision keeps them automatically.
      #
      # (Do NOT add --update-env-vars / --set-secrets back here, or it will
      # override the console-managed values.)

timeout: "1200s"
