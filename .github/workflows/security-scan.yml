name: Security scan (SCA)

# Active SCA on top of Dependabot alerts: pip-audit (Python) + npm audit (SPA).
# Advisory by design (continue-on-error) so a newly-published transitive
# advisory doesn't block every PR; findings show in the run logs and the weekly
# run. Tighten to blocking once the current backlog is cleared.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  pull_request:
    paths:
      - 'requirements.txt'
      - 'backend/requirements*.txt'
      - 'frontend/package-lock.json'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt -r backend/requirements.txt
        continue-on-error: true

  npm-audit:
    name: npm audit (SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Audit (high and above)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
