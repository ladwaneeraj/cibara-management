steps:
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "lodge-management"
      - "--source=."
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--clear-base-image"
      - "--update-env-vars=FIREBASE_CREDENTIALS=$$FIREBASE_CREDS,FIREBASE_STORAGE_BUCKET=cibara-software-61512.firebasestorage.app,MANAGER_PASSWORD=admin123,API_KEY=cibara-secure-2026"
    secretEnv: ["FIREBASE_CREDS"]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/firebase-credentials/versions/latest
      env: "FIREBASE_CREDS"

timeout: "1200s"
